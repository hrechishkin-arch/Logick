<!DOCTYPE html>
<html data-font="1" lang="ru">

  <title>Logick</title>

  <style>

    .tabs button.on, button.acc { background: var(--acc); color: #111; }
    button.danger { background: var(--warn); color: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 18px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .08em; }
    .brand img { height: 58px; width: auto; display: block; }
    .tabs { display: flex; gap: 6px; }
    .tabs button, button { border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 650; cursor: pointer; background: #ece6da; }
    .tabs button.on { background: var(--acc); color: #111; }
    button.acc { background: var(--acc); color: #111; }
    button.danger { background: var(--warn); color: #fff; }
    main { display: grid; grid-template-columns: 340px 1fr 300px; gap: 12px; padding: 0 16px 28px; }
    @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
    h2 { margin: 0 0 8px; font-size: 15px; }
    label { display: block; font-size: 12px; color: #666; margin: 8px 0 3px; }
    input, select, textarea { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
    textarea { min-height: 110px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .load-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .load-btns button { width: 100%; min-height: 38px; }
    .muted { color: #777; font-size: 12px; }
    .other-date { background: #fff1b8; border-radius: 8px; }
    .date-bar { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin: 8px 0 4px; }
    .truck { border: 1px solid #d7cbb6; border-radius: 12px; padding: 16px 10px 10px; margin: 42px 0; background: #fff; }
    .truck.head, summary.truck.head { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: #d9efd8; color: #111; border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; font-weight: 650; }
    summary.truck.head::-webkit-details-marker { display: none; }
    .tag { background: #ece6da; border-radius: 999px; padding: 2px 8px; font-size: 11px; }
    .tag.bad { background: #f3d6d2; }
    .pack { margin: 8px 0; padding: 6px 8px; border: 1px solid #e6dcc8; border-radius: 10px; background: #fffdf8; }
    .pack-head { display: flex; gap: 8px; align-items: flex-start; }
    .pack-head details { flex: 1; }
    .pack-head select { width: 180px; }
    .pack summary { cursor: pointer; }
    .one-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    .one-row span { min-width: 0; }
    button.mini { font-size: 11px; line-height: 1; padding: 3px 7px; white-space: nowrap; }
    .stop { display: grid; grid-template-columns: 22px 1fr 70px 120px; gap: 6px; padding: 6px 0; border-bottom: 1px dashed var(--line); align-items: start; }
    .basket { background: #f7f1e4; border-radius: 10px; padding: 8px 10px; margin-top: 8px; min-height: 34px; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; }
    .month { display: flex; flex-direction: column; gap: 8px; }
    .daycell { border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-height: 78px; text-align: left; background: #fff; color: #111; }
    .daycell.mon { background: #f6e7a8; }
    .daycell.weekend { background: #d7ebfa; }
    .daycell.mon button, .daycell.weekend button { background: #fff; color: #111; }
    .daycell b { display: block; color: #111; }
    .daycell .m { font-size: 11px; color: #111; }
    .zone-row { background: #d7ebfa; border-radius: 10px; padding: 6px; margin: 6px 0; }
    .zone-row input { background: #fff; }
    .hide { display: none; }
    #printArea { display: none; }
    @media print {
      @page { size: A4; margin: 0; }
      body * { display: none !important; }
      #printArea, #printArea * { display: block !important; visibility: visible; }
      #printArea { position: static; width: auto; padding: 0; font-size: 11px; line-height: 1.3; color: #111; }
      #printArea .sheet { box-sizing: border-box; min-height: 297mm; padding: 14mm; break-after: page; }
      #printArea h2 { font-size: 16px; margin: 0 0 6px; }
      #printArea h3 { font-size: 13px; margin: 10px 0 4px; break-after: avoid; }
      #printArea p { margin: 0 0 2px; }
      #printArea .truck-block { margin-top: 16px; padding-top: 10px; border-top: 1px solid #bbb; }
      #printArea .truck-name { margin: 0 0 6px; }
      #printArea .inv-head { margin: 0 0 18px; padding-bottom: 12px; border-bottom: 1px solid #bbb; }
      #printArea .stop-line { margin: 10px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #ddd; break-inside: avoid; }
      #printArea table { width: 100%; border-collapse: collapse; }
      #printArea td, #printArea th { border-bottom: 1px solid #ddd; padding: 3px 4px; text-align: left; vertical-align: top; }
      #printArea th { font-size: 10px; }
    }
  </style>
</head>

<header>
  <div>
    <div class="brand">
      <img src="logo.png" alt="Logick" />
    </div>
  </div>
  <div class="tabs">
    <button class="on" data-tab="day">День</button>

    <button data-tab="trip">Командировка</button>
  </div>
</header>
<main>

    <h2>Дата загрузки</h2>
    <div class="row">
      <div><label>Дата развоза</label><input id="date" type="date" /></div>
      <div><label>Лимит кг</label><input id="defaultCap" type="number" value="1500" /></div>
    </div>
    <label>Склад</label>
    <input id="depot" value="Столичное шоссе, 100, Киев" />
    <div class="row">
      <div><label>Заказы в машинах</label><input id="dayOrdersN" type="text" value="0" readonly /></div>
      <div><label>Общий километраж</label><input id="dayKm" type="text" value="0" readonly /></div>
    </div>
    <label>Вставьте график из Excel</label>
    <textarea id="pack" placeholder="Скопируйте из Excel вместе с шапкой: Заказ покупателя, Организация, Контрагент, Сумма, Дата отгрузки, Магазин"></textarea>
    <div class="load-btns">
      <button class="acc" id="loadPack">Добавить заявки</button>
      <button id="autoBtn">Загрузить машины</button>
      <button class="danger" id="clearDay">Очистить день</button>

    <p class="muted" id="loadStatus">Вставьте таблицу с шапкой и нажмите «Добавить заявки».</p>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><h2 style="margin:0">Без адреса</h2><button id="clearBasket" type="button">Очистить</button></div>
    <div class="basket" id="basket"><span style="color:#777">Пусто</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><h2 style="margin:0">Командировка, вне области</h2><button id="clearAway" type="button">Очистить</button></div>
    <div class="basket" id="away"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><h2 style="margin:0">Очередь дня</h2><button id="clearQueue" type="button">Очистить</button></div>
    <div class="basket" id="queue"></div>
  </section>
  <section class="card">
    <div class="head" style="display:flex;justify-content:space-between;align-items:center">
      <h2 id="boardTitle">Машины дня</h2>
      <button class="acc" id="addTruckBtn">+ машина</button>
    </div>
    <div id="board"></div>
  </section>
  <section class="card">
    <h2>Командировки</h2>
    <div id="tripList"></div>
  </section>
</main>

function moveStop(id, dir) {

  const list = state.orders.filter(x => x.truckId === o.truckId).sort((a,b) => (a.seq||0) - (b.seq||0));
  const groups = groupStops(list);
  const gi = groups.findIndex(g => g.orders.some(x => x.id === id));
  const gj = gi + dir;
  if (gi < 0 || gj < 0 || gj >= groups.length) return;
  const next = groups.slice();
  const [item] = next.splice(gi, 1);
  next.splice(gj, 0, item);
  let seq = 1;
  next.forEach(g => g.orders.forEach(x => { x.seq = seq++; }));

  s = s.replace(/ул\.?\s*/gi, "вулиця ");
  s = s.replace(/пр-т\s*|просп\.?\s*/gi, "проспект ");
  s = s.replace(/бул\.?\s*/gi, "бульвар ");
  s = s.replace(/пров\.?\s*/gi, "провулок ");
  s = s.replace(/(^|[\s,])пл\.?\s*/gi, "$1площа ");

  if (zone && !kyivDistrict && !s.toLowerCase().includes(String(zone).toLowerCase().slice(0, 6))) s = zone + ", " + s;
  const region = kyivDistrict ? "Київ, Україна" : "Київська область, Україна";
  return s + ", " + region;
}

  printSheet(`<section class="sheet"><h2>Отчёт за день ${fmt(date)}</h2><p class="inv-head">Машин: ${loaded.length}<br>Из таблицы: ${fromTable.size}<br>На машинах: ${ordersN}<br>Дублей снято: ${dupes.length}${asideLine}<br>Общий километраж: ${kmAll || "—"}<br>Сумма отгрузки: ${money(sumAll)}<br>Склад: ${esc($("depot").value)}</p>${blocks}${dupeBlock}</section>`);
}
function tripReport(id) {
  const t = state.trucks.find(x => x.id === id);
  if (!t) return;
  const stops = state.orders.filter(o => o.truckId === id).sort((a,b) => (a.seq||0) - (b.seq||0));
  if (!stops.length) { alert("В машине нет заявок."); return; }
  const sumAll = stops.reduce((s,o) => s + (Number(o.sum)||0), 0);
  const groups = Object.values(stops.reduce((m,o) => {
    const c = cityOf(o);
    (m[c] || (m[c] = { city: c, orders: [] })).orders.push(o);
    return m;
  }, {}));
  const line = o => `<p class="stop-line">${esc(orderLabel(o))} — ${esc(partyOf(o) || o.counterparty || o.client || "без контрагента")} — ${esc(o.address || o.shop || "без адреса")} — ${money(o.sum)}</p>`;
  const blocks = groups.map(g => {
    const sum = g.orders.reduce((s,o) => s + (Number(o.sum)||0), 0);
    return `<section class="truck-block"><p class="truck-name"><b>${esc(g.city)}</b><br>заказов ${g.orders.length} · сумма ${withFee(sum)}</p>${g.orders.map(line).join("")}</section>`;
  }).join("");
  printSheet(`<section class="sheet"><h2>Отчёт командировки ${esc(t.name || "")}</h2><p class="inv-head">Дата: ${fmt(t.date)}<br>Машина: ${esc(t.name || "")}<br>Направление: ${esc(t.zone || "—")}<br>Заказов: ${stops.length}<br>Городов: ${groups.length}<br>Общий километраж: ${t.kmTotal || "—"}<br>Сумма: ${money(sumAll)}<br>Склад: ${esc($("depot").value)}</p>${blocks}</section>`);
}

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) {
    c ^= bytes[i];
    for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xedb88320 & -(c & 1));
  }
  return (~c) >>> 0;
}
function u16(n) { return [n & 255, (n >> 8) & 255]; }
function u32(n) { return [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >> 24) & 255]; }
function zipStore(files) {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = enc.encode(f.data);
    const crc = crc32(data);
    const local = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0)]);
    parts.push(local, name, data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]));
    central.push(name);
    offset += local.length + name.length + data.length;
  });
  const centralStart = offset;
  const centralSize = central.reduce((s, x) => s + x.length, 0);
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(centralSize), ...u32(centralStart), ...u16(0)]);
  return new Blob([...parts, ...central, end], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
function xcell(v) {
  return String(v ?? "").replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");
}
function colRef(n) {
  let s = "";
  n += 1;
  while (n) { s = String.fromCharCode(65 + (n - 1) % 26) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function sheetXml(rows) {
  const body = rows.map((row, r) => `<row r="${r + 1}">${row.map((v, c) => `<c r="${colRef(c)}${r + 1}" t="inlineStr"><is><t xml:space="preserve">${xcell(v)}</t></is></c>`).join("")}</row>`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
}
function downloadXlsx(name, rows) {
  const files = [
    { name: "[Content_Types].xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>` },
    { name: "_rels/.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: "xl/workbook.xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Отчёт" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: "xl/_rels/workbook.xml.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>` },
    { name: "xl/worksheets/sheet1.xml", data: sheetXml(rows) }
  ];
  const a = document.createElement("a");
  a.href = URL.createObjectURL(zipStore(files));
  a.download = name.replace(/\.xls$/i, "") + ".xlsx";
  a.click();
}
function waybillXls(id) {
  const t = state.trucks.find(x => x.id === id);
  if (!t) return;
  const stops = state.orders.filter(o => o.truckId === id).sort((a,b) => (a.seq||0) - (b.seq||0));
  const groups = groupStops(stops, "address");
  const rows = [["N", "Контрагент", "Адрес", "Заказов"]];
  groups.forEach((g, i) => {
    const o = g.orders[0];
    rows.push([i + 1, o.counterparty || o.client || "Точка", o.address || "без адреса", g.orders.length]);
  });
  rows.push([]);
  rows.push(["Дата", fmt(t.date), "Машина", t.name || ""]);
  rows.push(["Склад", $("depot").value || "", "Километраж", t.kmTotal || ""]);
  rows.push(["Точек", groups.length, "Заказов", stops.length]);
  downloadXlsx(`putevoy-${t.name || "mashina"}-${t.date || ""}`, rows);
}
function dayReportXls(date) {
  const trucks = state.trucks.filter(t => t.lane === "day" && t.date === date);
  if (!trucks.length) { alert("На эту дату нет машин."); return; }
  const rows = [["N", "Машина", "Номер", "Контрагент", "Адрес", "Сумма"]];
  let n = 1;
  trucks.forEach(t => {
    const stops = state.orders.filter(o => o.truckId === t.id).sort((a,b) => (a.seq||0) - (b.seq||0));
    stops.forEach(o => rows.push([n++, t.name || "", orderLabel(o), partyOf(o) || o.counterparty || o.client || "", o.address || o.shop || "", Number(o.sum) || 0]));
  });
  downloadXlsx(`otchet-${date}`, rows);
}
function pdf(id, closed) {
  const t = state.trucks.find(x => x.id === id);
  const stops = state.orders.filter(o => o.truckId === id).sort((a,b) => (a.seq||0) - (b.seq||0));
  const sum = stops.reduce((s,o)=>s+(Number(o.sum)||0),0);
  const groups = groupStops(stops, "address");
  const rows = groups.map((g, i) => {
    const o = g.orders[0];
    return `<p class="stop-line"><b>${i + 1}. ${esc(o.counterparty || o.client || "Точка")}</b><br>${esc(o.address || "без адреса")}</p>`;
  }).join("");
  printSheet(`<section class="sheet"><h2>Путевой лист</h2><p class="inv-head">Дата: ${fmt(t.date)}<br>Машина: ${esc(t.name || "")}<br>Доставка: ${esc(t.zone || "—")}<br>Склад: ${esc($("depot").value)}<br>Точек: ${groups.length}<br>Заказов: ${stops.length}<br>Общий километраж: ${t.kmTotal || "—"}<br>Сумма: ${withFee(sum)}</p>${rows}</section>`, 1.4);
}
load();
$("date").value = state.date || new Date(Date.now()+86400000).toISOString().slice(0,10);
$("depot").value = state.depot;
$("defaultCap").value = state.defaultCap;
["depot","defaultCap"].forEach(id => $(id).onchange = () => { state[id] = id==="depot" ? $(id).value : Number($(id).value); save(); });
$("dayReportBtn").onclick = () => dayReport($("date").value);
$("dayXlsBtn").onclick = () => dayReportXls($("date").value);
$("date").onchange = () => { state.date = $("date").value; save(); };
document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x.dataset.tab === state.tab));
render();
setTimeout(() => {
  const y = new Date(); y.setDate(y.getDate()-1);
  const iso = localISO(y);
  if (state.lastReportDate === iso) return;
  const had = state.trucks.some(t => t.lane === "day" && t.date === iso);
  if (!had) return;
  if (confirm("День " + fmt(iso) + " закончился. Сформировать общий отчёт по всем машинам?")) dayReport(iso);
  state.lastReportDate = iso;
  localStorage.setItem(KEY, JSON.stringify(state));
}, 400);
</script>

<script>
(function(){
  const play = document.getElementById("logickPlay");

  const mute = document.getElementById("logickMute");
  const audio = document.getElementById("logickAudio");
  const playShape = '<polygon points="4,1.5 10.5,6 4,10.5" fill="#fff"/>';
  const pauseShape = '<rect x="2.5" y="1.5" width="2.4" height="9" fill="#fff"/><rect x="7.1" y="1.5" width="2.4" height="9" fill="#fff"/>';

  play.onclick = () => { if (audio.paused) audio.play(); else audio.pause(); draw(); };

})();
