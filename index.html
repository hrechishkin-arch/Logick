<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logick</title>

  <style>

    .tabs button.on, button.acc { background: var(--acc); color: #111; }
    button.danger { background: var(--warn); color: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 18px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .08em; }
    .brand img { height: 58px; width: auto; display: block; }
    .tabs { display: flex; gap: 6px; }
    .tabs button, button { border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 650; cursor: pointer; background: #ece6da; }
    .tabs button.on { background: var(--acc); color: #111; }
    button.acc { background: var(--acc); color: #111; }
    button.danger { background: var(--warn); color: #fff; }
    main { display: grid; grid-template-columns: 340px 1fr 300px; gap: 12px; padding: 0 16px 28px; }
    @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
    h2 { margin: 0 0 8px; font-size: 15px; }
    label { display: block; font-size: 12px; color: #666; margin: 8px 0 3px; }
    input, select, textarea { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
    textarea { min-height: 110px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .load-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .load-btns button { width: 100%; min-height: 38px; }
    .muted { color: #777; font-size: 12px; }
    .other-date { background: #fff1b8; border-radius: 8px; }
    .date-bar { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin: 8px 0 4px; }
    .truck { border: 1px solid #d7cbb6; border-radius: 12px; padding: 16px 10px 10px; margin: 42px 0; background: #fff; }
    .truck.head, summary.truck.head { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: #d9efd8; color: #111; border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; font-weight: 650; }
    summary.truck.head::-webkit-details-marker { display: none; }
    .tag { background: #ece6da; border-radius: 999px; padding: 2px 8px; font-size: 11px; }
    .tag.bad { background: #f3d6d2; }
    .pack { margin: 8px 0; padding: 6px 8px; border: 1px solid #e6dcc8; border-radius: 10px; background: #fffdf8; }
    .pack-head { display: flex; gap: 8px; align-items: flex-start; }
    .pack-head details { flex: 1; }
    .pack-head select { width: 180px; }
    .pack summary { cursor: pointer; }
    .one-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    .one-row span { min-width: 0; }
    button.mini { font-size: 11px; line-height: 1; padding: 3px 7px; white-space: nowrap; }
    .stop { display: grid; grid-template-columns: 22px 1fr 70px 120px; gap: 6px; padding: 6px 0; border-bottom: 1px dashed var(--line); align-items: start; }
    .basket { background: #f7f1e4; border-radius: 10px; padding: 8px 10px; margin-top: 8px; min-height: 34px; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; }
    .month { display: flex; flex-direction: column; gap: 8px; }
    .daycell { border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-height: 78px; text-align: left; background: #fff; color: #111; }
    .daycell.mon { background: #f6e7a8; }
    .daycell.weekend { background: #d7ebfa; }
    .daycell.mon button, .daycell.weekend button { background: #fff; color: #111; }
    .daycell b { display: block; color: #111; }
    .daycell .m { font-size: 11px; color: #111; }
    .zone-row { background: #d7ebfa; border-radius: 10px; padding: 6px; margin: 6px 0; }
    .zone-row input { background: #fff; }
    .hide { display: none; }
    #printArea { display: none; }
    @media print {
      @page { size: A4; margin: 0; }
      body * { display: none !important; }
      #printArea, #printArea * { display: block !important; visibility: visible; }
      #printArea { position: static; width: auto; padding: 0; font-size: 11px; line-height: 1.3; color: #111; }
      #printArea .sheet { box-sizing: border-box; min-height: 297mm; padding: 14mm; break-after: page; }
      #printArea h2 { font-size: 16px; margin: 0 0 6px; }
      #printArea h3 { font-size: 13px; margin: 10px 0 4px; break-after: avoid; }
      #printArea p { margin: 0 0 2px; }
      #printArea .truck-block { margin-top: 16px; padding-top: 10px; border-top: 1px solid #bbb; }
      #printArea .truck-name { margin: 0 0 6px; }
      #printArea .inv-head { margin: 0 0 18px; padding-bottom: 12px; border-bottom: 1px solid #bbb; }
      #printArea .stop-line { margin: 10px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #ddd; break-inside: avoid; }
      #printArea table { width: 100%; border-collapse: collapse; }
      #printArea td, #printArea th { border-bottom: 1px solid #ddd; padding: 3px 4px; text-align: left; vertical-align: top; }
      #printArea th { font-size: 10px; }
    }
  </style>
</head>

<header>
  <div>
    <div class="brand">
      <img src="logo.png" alt="Logick" />
    </div>
  </div>
  <div class="tabs">
    <button class="on" data-tab="day">День</button>
    <button data-tab="month">Месяц</button>
    <button data-tab="trip">Командировка</button>
  </div>
</header>
<main>
  <section class="card">
    <h2>Дата загрузки</h2>
    <div class="row">
      <div><label>Дата развоза</label><input id="date" type="date" /></div>
      <div><label>Лимит кг</label><input id="defaultCap" type="number" value="1500" /></div>
    </div>
    <label>Склад</label>
    <input id="depot" value="Столичное шоссе, 100, Киев" />
    <div class="row">
      <div><label>Количество заявок</label><input id="dayOrdersN" type="text" value="0" readonly /></div>
      <div><label>Общий километраж</label><input id="dayKm" type="text" value="0" readonly /></div>
    </div>
    <label>Вставьте график из Excel</label>
    <textarea id="pack" placeholder="Скопируйте из Excel вместе с шапкой: Заказ покупателя, Организация, Контрагент, Сумма, Дата отгрузки, Магазин"></textarea>
    <div class="load-btns">
      <button class="acc" id="loadPack">Добавить заявки</button>
      <button id="autoBtn">Загрузить машины</button>
      <button class="danger" id="clearDay">Очистить день</button>
      <button id="dayReportBtn">Отчёт за день</button>
    </div>
    <p class="muted" id="loadStatus">Вставьте таблицу с шапкой и нажмите «Добавить заявки».</p>
    <p class="muted" id="estimate" style="display:none"></p>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><h2 style="margin:0">Без адреса</h2><button id="clearBasket" type="button">Очистить</button></div>
    <div class="basket" id="basket"><span style="color:#777">Пусто</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><h2 style="margin:0">Командировка, вне области</h2><button id="clearAway" type="button">Очистить</button></div>
    <div class="basket" id="away"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><h2 style="margin:0">Очередь дня</h2><button id="clearQueue" type="button">Очистить</button></div>
    <div class="basket" id="queue"></div>
  </section>
  <section class="card">
    <div class="head" style="display:flex;justify-content:space-between;align-items:center">
      <h2 id="boardTitle">Машины дня</h2>
      <button class="acc" id="addTruckBtn">+ машина</button>
    </div>
    <div id="board"></div>
  </section>
  <section class="card">
    <h2>Командировки</h2>
    <div id="tripList"></div>
  </section>
</main>
<div id="printArea" class="hide"></div>

function bind() {
  document.querySelectorAll("[data-opendate]").forEach(el => el.onclick = () => {
    $("date").value = el.dataset.opendate;
    state.date = el.dataset.opendate;
    save();
  });
  document.querySelectorAll("[data-cityto]").forEach(el => el.onchange = () => {
    const city = decodeURIComponent(el.dataset.cityto || '');
    const t = state.trucks.find(x => x.id === el.value);
    if (!city || !t) return;
    const rows = state.orders.filter(o => !o.truckId && outsideKyiv(o) && tripCity(o) === city);
    if (!rows.length) return;
    let seq = state.orders.filter(x => x.truckId === t.id).reduce((m, x) => Math.max(m, Number(x.seq) || 0), 0);
    rows.forEach(o => { o.truckId = t.id; o.seq = ++seq; o.basket = false; rememberDate(o); if (t.date && t.date !== "trip") o.date = t.date; o.lane = t.lane || "trip"; });
    save();
  });
  document.querySelectorAll("[data-pack]").forEach(el => el.onchange = () => {

    let seq = state.orders.filter(x => x.truckId === t.id).reduce((m,x) => Math.max(m, Number(x.seq)||0), 0);
    state.orders.forEach(o => {
      if (!ids.includes(o.id)) return;
      o.truckId = t.id;
      o.seq = ++seq;
      o.basket = false;
      rememberDate(o); if (t.date && t.date !== "trip") o.date = t.date;
      o.lane = t.lane || o.lane;

  });
  document.querySelectorAll("[data-to]").forEach(el => el.onchange = () => {

    const t = state.trucks.find(x => x.id === el.value);
    if (!o || !t) return;
    if (!t.zone && o.zone) t.zone = o.zone;
    const inTruck = state.orders.filter(x => x.truckId === t.id);
    o.seq = inTruck.reduce((m, x) => Math.max(m, Number(x.seq) || 0), 0) + 1;
    o.truckId = t.id;
    o.basket = false;
    rememberDate(o); if (t.date && t.date !== "trip") o.date = t.date;
    o.lane = t.lane || o.lane;
    save();
  });
  document.querySelectorAll("[data-del]").forEach(el => el.onclick = () => { state.orders = state.orders.filter(x => x.id !== el.dataset.del); save(); });
  document.querySelectorAll("[data-rename]").forEach(el => el.onchange = () => {

  document.querySelectorAll("[data-cap]").forEach(el => el.onchange = () => { state.trucks.find(t=>t.id===el.dataset.cap).cap = Number(el.value||0); save(); });
  document.querySelectorAll("[data-kml]").forEach(el => el.onchange = () => { state.trucks.find(t=>t.id===el.dataset.kml).kmTotal = Number(el.value||0); save(); });
  document.querySelectorAll("[data-tdate]").forEach(el => el.onchange = () => { state.trucks.find(t=>t.id===el.dataset.tdate).date = el.value; save(); });
  document.querySelectorAll("[data-docs]").forEach(el => el.onchange = () => { state.orders.find(o=>o.id===el.dataset.docs).docs = Number(el.value||0); save(); });
  document.querySelectorAll("[data-sum]").forEach(el => el.onchange = () => { state.orders.find(o=>o.id===el.dataset.sum).sum = Number(el.value||0); save(); });
  document.querySelectorAll("[data-upfree]").forEach(el => el.onclick = () => { state.orders.forEach(o => { if (o.truckId === el.dataset.upfree) { o.truckId = null; o.basket = !o.address; } }); save(); });
  document.querySelectorAll("[data-movego]").forEach(el => el.onclick = () => {
    const from = state.trucks.find(x => x.id === el.dataset.movego);
    const sel = document.querySelector(`[data-move="${el.dataset.movego}"]`);
    const to = state.trucks.find(x => x.id === (sel && sel.value));
    if (!from || !to) { alert("Выберите машину, куда перегрузить."); return; }
    const orders = state.orders.filter(o => o.truckId === from.id).sort((a,b) => (a.seq||0) - (b.seq||0));
    if (!orders.length) { alert("В машине нет заказов."); return; }
    if (!confirm("Перегрузить " + orders.length + " зак. из «" + (from.name||"Машина") + "» в «" + (to.name||"Машина") + "»?")) return;
    const last = state.orders.filter(o => o.truckId === to.id).reduce((m,o) => Math.max(m, o.seq||0), 0);
    orders.forEach((o,i) => { o.truckId = to.id; o.seq = last + i + 1; rememberDate(o); o.date = to.date; o.lane = to.lane === "trip" ? "trip" : "day"; });
    if (!state.orders.some(o => o.truckId === from.id)) state.trucks = state.trucks.filter(x => x.id !== from.id);
    save();
  });
  document.querySelectorAll("[data-drop]").forEach(el => el.onclick = () => {
    const t = state.trucks.find(x => x.id === el.dataset.drop);
    if (!confirm("Удалить машину?")) return;
    state.orders.forEach(o => { if (o.truckId === el.dataset.drop) { o.truckId = null; o.basket = !o.address; } });
    state.trucks = state.trucks.filter(x => x.id !== el.dataset.drop);
    save();
  });
  document.querySelectorAll("[data-pdf]").forEach(el => el.onclick = () => pdf(el.dataset.pdf));
  document.querySelectorAll("[data-treport]").forEach(el => el.onclick = () => tripReport(el.dataset.treport));
  document.querySelectorAll("[data-route]").forEach(el => el.onclick = () => route(el.dataset.route));
  document.querySelectorAll("[data-up]").forEach(el => el.onclick = () => moveStop(el.dataset.up, -1));
  document.querySelectorAll("[data-down]").forEach(el => el.onclick = () => moveStop(el.dataset.down, 1));
  document.querySelectorAll("[data-basket]").forEach(el => el.onclick = () => {
    const ids = String(el.dataset.basket || "").split(",").filter(Boolean);
    if (!ids.length) return;
    state.orders.forEach(x => {
      if (ids.includes(x.id)) { x.truckId = null; x.basket = !x.address; restoreDate(x); }
    });
    save();
  });
  document.querySelectorAll("[data-one]").forEach(el => el.onclick = (ev) => {
    ev.preventDefault();
    ev.stopPropagation();
    const o = state.orders.find(x => x.id === el.dataset.one);
    if (!o) return;
    keepOpen = [...document.querySelectorAll("details[data-keep][open]")].map(d => d.dataset.keep);
    o.truckId = null;
    o.basket = !o.address;
    restoreDate(o);
    save();
  });
  document.querySelectorAll("[data-day]").forEach(el => el.onclick = () => {
    $("date").value = el.dataset.day;
    state.date = el.dataset.day;
    state.showDate = true;
    state.tab = "day";
    document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x.dataset.tab === "day"));
    save();
  });
}
function moveStop(id, dir) {
  const o = state.orders.find(x => x.id === id);
  if (!o) return;
  const list = state.orders.filter(x => x.truckId === o.truckId).sort((a,b) => (a.seq||0) - (b.seq||0));
  const groups = groupStops(list);
  const gi = groups.findIndex(g => g.orders.some(x => x.id === id));
  const gj = gi + dir;
  if (gi < 0 || gj < 0 || gj >= groups.length) return;
  const next = groups.slice();
  const [item] = next.splice(gi, 1);
  next.splice(gj, 0, item);
  let seq = 1;
  next.forEach(g => g.orders.forEach(x => { x.seq = seq++; }));
  save();
}
function mapsQuery(address, zone) {
  let s = String(address || "").replace(/\s+/g, " ").trim();
  s = s.replace(/(^|[\s,])с\.?\s*/gi, "$1село ");
  s = s.replace(/(^|[\s,])смт\.?\s*/gi, "$1селище ");
  s = s.replace(/(^|[\s,])м\.?\s*/gi, "$1місто ");
  s = s.replace(/вул\.?\s*/gi, "вулиця ");
  s = s.replace(/ул\.?\s*/gi, "вулиця ");
  s = s.replace(/пр-т\s*|просп\.?\s*/gi, "проспект ");
  s = s.replace(/бул\.?\s*/gi, "бульвар ");
  s = s.replace(/пров\.?\s*/gi, "провулок ");
  s = s.replace(/(^|[\s,])пл\.?\s*/gi, "$1площа ");
  if (!/вулиц|проспект|бульвар|провулок|шосе|шоссе|площа|набережн/i.test(s)) {
    s = s.replace(/,\s*([^,\d]{2,40}?)\s*,?\s*(\d)/, ", вулиця $1, $2");
  }
  if (/львівськ|львовск/i.test(s) && !/площа/i.test(s)) s = s.replace(/львівська|львовская/ig, "вулиця Львівська");
  const kyivDistrict = /ский$|ський$/.test(zone || "") && !/борщаг|гатн|новос|крюков|фастов|вишнев|ирпен|буча|бровар|бориспол|обухов|васильк|вишгород|церк|гостомел|боярк/i.test(zone || "");
  if (zone && !kyivDistrict && !s.toLowerCase().includes(String(zone).toLowerCase().slice(0, 6))) s = zone + ", " + s;
  const region = kyivDistrict ? "Київ, Україна" : "Київська область, Україна";
  return s + ", " + region;
}
function route(id) {
  const stops = state.orders.filter(o => o.truckId === id && o.address && !/міхнов|optimizer/i.test(o.address)).sort((a,b) => (a.seq||0) - (b.seq||0));
  if (!stops.length) { alert("В машине нет адресов."); return; }
  const parts = [$("depot").value + ", Україна", ...groupStops(stops).map(g => mapsQuery(g.orders[0].address, g.orders[0].zone))].map(s => encodeURIComponent(s));
  window.open("https://www.google.com/maps/dir/" + parts.join("/"), "_blank");
}
function closeTrip(id) {
  const t = state.trucks.find(x => x.id === id);
  if (!t) return;
  const km = prompt("Фактический километраж", t.factKm || "");
  if (km === null) return;
  const sum = prompt("Фактическая сумма, грн", t.factSum || "");
  if (sum === null) return;
  const note = prompt("Факт: что изменилось", t.factNote || "");
  if (note === null) return;
  t.factKm = km;
  t.factSum = sum;
  t.factNote = note;
  t.closed = true;
  save();
  pdf(id, true);
}
function esc(s) { return String(s ?? "").replace(/[&<>]/g, ch => ch === "&" ? "\x26amp;" : ch === "<" ? "\x26lt;" : "\x26gt;"); }
function orderLabel(o) { return orderKey(o.orderNo) || o.orderNo || "без номера"; }
function partyOf(o) { return o.counterparty || o.client || ""; }
function printSheet(html) {
  const frame = document.createElement("iframe");
  frame.setAttribute("aria-hidden", "true");
  frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
  document.body.appendChild(frame);
  const doc = frame.contentWindow.document;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title> </title><style>
    @page { size: A4; margin: 8mm 10mm; }
    html, body { margin: 0; background: #fff; color: #111; }
    body { font: 10px/1.25 "Segoe UI", Arial, sans-serif; }
    .sheet { box-sizing: border-box; }
    h2 { font-size: 14px; margin: 0 0 4px; }
    h3 { font-size: 12px; margin: 6px 0 2px; }
    p { margin: 0 0 1px; }
    .inv-head { margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid #ccc; }
    .stop-line { margin: 4px 0 3px; padding-bottom: 2px; border-bottom: 1px solid #e4e4e4; break-inside: avoid; }
    .truck-block { margin-top: 8px; padding-top: 6px; border-top: 1px solid #ccc; }
  </style></head><body>${html}</body></html>`);
  doc.close();
  setTimeout(() => {
    frame.contentWindow.focus();
    frame.contentWindow.print();
    setTimeout(() => frame.remove(), 1000);
  }, 200);
}
function dayReport(date) {
  const trucks = state.trucks.filter(t => t.lane === "day" && t.date === date);
  if (!trucks.length) { alert("На эту дату нет машин."); return; }
  const seen = new Set();
  const dupes = [];
  const loaded = [];
  trucks.forEach(t => {
    const stops = state.orders.filter(o => o.truckId === t.id).sort((a,b) => (a.seq||0) - (b.seq||0));
    const kept = [];
    stops.forEach(o => {
      const key = orderKey(o.orderNo) || String(o.orderNo || "").trim();
      if (key && seen.has(key)) { dupes.push(o); return; }
      if (key) seen.add(key);
      kept.push(o);
    });
    if (kept.length) loaded.push({ t, stops: kept });
  });
  (state.dupes || []).filter(d => d.date === date).forEach(d => {
    const key = orderKey(d.orderNo) || String(d.orderNo || "").trim();
    if (key && dupes.some(x => (orderKey(x.orderNo) || String(x.orderNo || "").trim()) === key && Number(x.sum) === Number(d.sum))) return;
    dupes.push(d);
  });
  const ordersN = loaded.reduce((s, x) => s + x.stops.length, 0);
  const sumAll = loaded.reduce((s, x) => s + x.stops.reduce((a, o) => a + (Number(o.sum) || 0), 0), 0);
  const kmAll = loaded.reduce((s, x) => s + (Number(x.t.kmTotal) || 0), 0);
  const orderLine = o => `<p class="stop-line">${esc(orderLabel(o))} — ${esc(partyOf(o) || "без контрагента")} — ${esc(o.address || o.shop || "без адреса")} — ${money(o.sum)}</p>`;
  const blocks = loaded.map(({ t, stops }) => {
    const sum = stops.reduce((s, o) => s + (Number(o.sum) || 0), 0);
    return `<section class="truck-block"><p class="truck-name"><b>${esc(t.name)}</b><br>заказов ${stops.length} · км ${t.kmTotal || "—"} · сумма ${money(sum)}</p>${stops.map(orderLine).join("")}</section>`;
  }).join("");
  const dupeBlock = dupes.length ? `<section class="truck-block"><p class="truck-name"><b>Дубли</b><br>снято ${dupes.length}</p>${dupes.map(o => `<p class="stop-line">${esc(orderLabel(o))} — ${esc(partyOf(o) || "без контрагента")} — ${esc(o.address || o.shop || "без адреса")} — ${money(o.sum)} — продублирован и снят</p>`).join("")}</section>` : "";
  const fromTable = new Set((state.imported && state.imported[date]) || []);
  state.orders.filter(o => o.date === date).forEach(o => {
    const key = orderKey(o.orderNo) || String(o.orderNo || "").trim();
    if (key) fromTable.add(key);
  });
  dupes.forEach(o => {
    const key = orderKey(o.orderNo) || String(o.orderNo || "").trim();
    if (key) fromTable.add(key);
  });
  const onTrucks = new Set();
  loaded.forEach(x => x.stops.forEach(o => {
    const key = orderKey(o.orderNo) || String(o.orderNo || "").trim();
    if (key) onTrucks.add(key);
  }));
  const aside = state.orders.filter(o => o.date === date && !onTrucks.has(orderKey(o.orderNo) || String(o.orderNo || "").trim()));
  const asideLine = aside.length ? `<br>Командировка: ${aside.length} — ${aside.map(o => esc(orderLabel(o)) + (o.lane === "trip" || outsideKyiv(o) ? " командировка" : o.truckId ? "" : " не в машине")).join("; ")}` : "";
  printSheet(`<section class="sheet"><h2>Отчёт за день ${fmt(date)}</h2><p class="inv-head">Машин: ${loaded.length}<br>Из таблицы: ${fromTable.size}<br>На машинах: ${ordersN}<br>Дублей снято: ${dupes.length}${asideLine}<br>Общий километраж: ${kmAll || "—"}<br>Сумма отгрузки: ${money(sumAll)}<br>Склад: ${esc($("depot").value)}</p>${blocks}${dupeBlock}</section>`);
}
function tripReport(id) {
  const t = state.trucks.find(x => x.id === id);
  if (!t) return;
  const stops = state.orders.filter(o => o.truckId === id).sort((a,b) => (a.seq||0) - (b.seq||0));
  if (!stops.length) { alert("В машине нет заявок."); return; }
  const sumAll = stops.reduce((s,o) => s + (Number(o.sum)||0), 0);
  const groups = Object.values(stops.reduce((m,o) => {
    const c = cityOf(o);
    (m[c] || (m[c] = { city: c, orders: [] })).orders.push(o);
    return m;
  }, {}));
  const line = o => `<p class="stop-line">${esc(orderLabel(o))} — ${esc(partyOf(o) || o.counterparty || o.client || "без контрагента")} — ${esc(o.address || o.shop || "без адреса")} — ${money(o.sum)}</p>`;
  const blocks = groups.map(g => {
    const sum = g.orders.reduce((s,o) => s + (Number(o.sum)||0), 0);
    return `<section class="truck-block"><p class="truck-name"><b>${esc(g.city)}</b><br>заказов ${g.orders.length} · сумма ${money(sum)}</p>${g.orders.map(line).join("")}</section>`;
  }).join("");
  printSheet(`<section class="sheet"><h2>Отчёт командировки ${esc(t.name || "")}</h2><p class="inv-head">Дата: ${fmt(t.date)}<br>Машина: ${esc(t.name || "")}<br>Направление: ${esc(t.zone || "—")}<br>Заказов: ${stops.length}<br>Городов: ${groups.length}<br>Общий километраж: ${t.kmTotal || "—"}<br>Сумма: ${money(sumAll)}<br>Склад: ${esc($("depot").value)}</p>${blocks}</section>`);
}
function pdf(id, closed) {
  const t = state.trucks.find(x => x.id === id);
  const stops = state.orders.filter(o => o.truckId === id).sort((a,b) => (a.seq||0) - (b.seq||0));
  const sum = stops.reduce((s,o)=>s+(Number(o.sum)||0),0);
  const groups = groupStops(stops, "address");
  const rows = groups.map((g, i) => {
    const o = g.orders[0];
    const nums = g.orders.map(x => esc(orderLabel(x))).join("<br>");
    return `<p class="stop-line"><b>${i + 1}. ${esc(o.counterparty || o.client || "Точка")}</b> · ${g.orders.length} зак.<br>${esc(o.address || "без адреса")}<br>${nums}</p>`;
  }).join("");
  printSheet(`<section class="sheet"><h2>Путевой лист</h2><p class="inv-head">Дата: ${fmt(t.date)}<br>Машина: ${esc(t.name || "")}<br>Доставка: ${esc(t.zone || "—")}<br>Склад: ${esc($("depot").value)}<br>Точек: ${groups.length}<br>Заказов: ${stops.length}<br>Общий километраж: ${t.kmTotal || "—"}<br>Сумма: ${money(sum)}</p>${rows}</section>`);
}
load();
$("date").value = state.date || new Date(Date.now()+86400000).toISOString().slice(0,10);
$("depot").value = state.depot;
$("defaultCap").value = state.defaultCap;
["depot","defaultCap"].forEach(id => $(id).onchange = () => { state[id] = id==="depot" ? $(id).value : Number($(id).value); save(); });
$("dayReportBtn").onclick = () => dayReport($("date").value);
$("date").onchange = () => { state.date = $("date").value; save(); };
document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x.dataset.tab === state.tab));
render();
setTimeout(() => {
  const y = new Date(); y.setDate(y.getDate()-1);
  const iso = localISO(y);
  if (state.lastReportDate === iso) return;
  const had = state.trucks.some(t => t.lane === "day" && t.date === iso);
  if (!had) return;
  if (confirm("День " + fmt(iso) + " закончился. Сформировать общий отчёт по всем машинам?")) dayReport(iso);
  state.lastReportDate = iso;
  localStorage.setItem(KEY, JSON.stringify(state));
}, 400);
