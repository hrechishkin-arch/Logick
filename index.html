<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logick</title>
  <link rel="icon" href="favicon.png?v=46" type="image/png" />
  <link rel="apple-touch-icon" href="favicon.png?v=46" />
  <style>
    :root { --bg:#f3efe6; --ink:#1c1c1c; --line:#d8d0c2; --card:#fffdf8; --acc:#d7ebfa; --warn:#1c1c1c; }
    .tabs button.on, button.acc { background: var(--acc); color: #111; }
    button.danger { background: var(--warn); color: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 18px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .08em; }
    .brand img { height: 58px; width: auto; display: block; }
    .tabs { display: flex; gap: 6px; }
    .tabs button, button { border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 650; cursor: pointer; background: #ece6da; }
    .tabs button.on { background: var(--acc); color: #111; }
    button.acc { background: var(--acc); color: #111; }
    button.danger { background: var(--warn); color: #fff; }
    main { display: grid; grid-template-columns: 340px 1fr 300px; gap: 12px; padding: 0 16px 28px; }
    @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
    h2 { margin: 0 0 8px; font-size: 15px; }
    label { display: block; font-size: 12px; color: #666; margin: 8px 0 3px; }
    input, select, textarea { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
    textarea { min-height: 110px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .muted { color: #777; font-size: 12px; }
    .truck { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 8px 0; background: #fff; }
    .truck.head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .tag { background: #ece6da; border-radius: 999px; padding: 2px 8px; font-size: 11px; }
    .tag.bad { background: #f3d6d2; }
    .stop { display: grid; grid-template-columns: 22px 1fr 70px 90px; gap: 6px; padding: 6px 0; border-bottom: 1px dashed var(--line); align-items: start; }
    .basket { background: #f7f1e4; border-radius: 10px; padding: 8px 10px; margin-top: 8px; min-height: 34px; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; }
    .month { display: flex; flex-direction: column; gap: 8px; }
    .daycell { border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-height: 78px; text-align: left; background: #fff; color: #111; }
    .daycell.mon { background: #f6e7a8; }
    .daycell.weekend { background: #d7ebfa; }
    .daycell.mon button, .daycell.weekend button { background: #fff; color: #111; }
    .daycell b { display: block; color: #111; }
    .daycell .m { font-size: 11px; color: #111; }
    .zone-row { background: #d7ebfa; border-radius: 10px; padding: 6px; margin: 6px 0; }
    .zone-row input { background: #fff; }
    .hide { display: none; }
    #printArea { display: none; }
    @media print {
      @page { size: A4; margin: 0; }
      body * { display: none !important; }
      #printArea, #printArea * { display: block !important; visibility: visible; }
      #printArea { position: static; width: auto; padding: 14mm; }
      #printArea li { break-inside: avoid; margin-bottom: 8px; }
    }
  </style>
</head>
<body>
<header>
  <div>
    <div class="brand">
      <img src="logo.png" alt="Logick" />
    </div>
  </div>
  <div class="tabs">
    <button class="on" data-tab="day">День</button>
    <button data-tab="month">Месяц</button>
    <button data-tab="trip">Командировка</button>
  </div>
</header>
<main>
  <section class="card">
    <h2>Дата загрузки</h2>
    <div class="row">
      <div><label>Дата развоза</label><input id="date" type="date" /></div>
      <div><label>Лимит кг</label><input id="defaultCap" type="number" value="1500" /></div>
    </div>
    <label>Склад / старт</label>
    <input id="depot" value="Столичное шоссе, 100, Киев" />
    <div class="row">
      <div><label>Точек на машину</label><input id="perTruck" type="number" value="12" min="4" /></div>
      <div><label>Лимит км</label><input id="kmLimit" type="number" value="120" /></div>
    </div>
    <label>Вставьте график из Excel</label>
    <textarea id="pack" placeholder="Скопируйте из Excel вместе с шапкой: Заказ покупателя, Организация, Контрагент, Сумма, Дата отгрузки, Магазин"></textarea>
    <div class="btns">
      <button class="acc" id="loadPack">Добавить заявки</button>
      <button id="autoBtn">Загрузить машины</button>
      <button class="danger" id="clearDay">Очистить день</button>
    </div>
    <p class="muted" id="loadStatus">Вставьте таблицу с шапкой и нажмите «Добавить заявки».</p>
    <p class="muted" id="estimate" style="display:none"></p>
    <h2 style="margin-top:16px">Без адреса</h2>
    <div class="basket" id="basket"><span style="color:#777">Пусто</span></div>
    <h2 style="margin-top:12px">Командировка, вне области</h2>
    <div class="basket" id="away"></div>
    <h2 style="margin-top:12px">Очередь дня</h2>
    <div class="basket" id="queue"></div>
  </section>
  <section class="card">
    <div class="head" style="display:flex;justify-content:space-between;align-items:center">
      <h2 id="boardTitle">Машины дня</h2>
      <button class="acc" id="addTruckBtn">+ машина</button>
    </div>
    <div id="board"></div>
  </section>
  <section class="card">
    <h2>Командировки</h2>
    <div id="tripList"></div>
  </section>
</main>
<div id="printArea" class="hide"></div>
<script>
const KEY = "logick-v2";
const KYIV = ["Голосеевский","Дарницкий","Деснянский","Днепровский","Оболонский","Печерский","Подольский","Святошинский","Соломенский","Шевченковский"];
const OBLAST = ["Вишнёвое","Ирпень","Буча","Бровары","Борисполь","Обухов","Васильков","Вышгород","Белая Церковь","Гостомель","Боярка"];
const AREA = [
  ["оболон","Оболонский"],["минск","Оболонский"],["троещин","Деснянский"],["лісов","Деснянский"],["лесов","Деснянский"],
  ["дарниц","Дарницкий"],["позняк","Дарницкий"],["осжорн","Дарницкий"],["харьков","Дарницкий"],["харків","Дарницкий"],
  ["левобереж","Днепровский"],["лівобереж","Днепровский"],["русанов","Днепровский"],["березняк","Днепровский"],
  ["печер","Печерский"],["подол","Подольский"],["поділ","Подольский"],["куренев","Подольский"],["виноградар","Подольский"],
  ["святошин","Святошинский"],["борщаг","Святошинский"],["соломен","Соломенский"],["солом","Соломенский"],["отрадн","Соломенский"],["відрад","Соломенский"],
  ["голосеев","Голосеевский"],["голосі","Голосеевский"],["теремк","Голосеевский"],["демеев","Голосеевский"],
  ["шевченк","Шевченковский"],["крещатик","Шевченковский"],["хрещатик","Шевченковский"],
  ["вишнев","Вишнёвое"],["вишнёв","Вишнёвое"],["ирпен","Ирпень"],["ірпін","Ирпень"],["буча","Буча"],
  ["бровар","Бровары"],["бориспол","Борисполь"],["бориспіль","Борисполь"],["обухов","Обухов"],["обухів","Обухов"],
  ["васильков","Васильков"],["васильк","Васильков"],["вышгород","Вышгород"],["вишгород","Вышгород"],
  ["кольцов","Святошинский"],["кільцев","Святошинский"],["кустанай","Дарницкий"],["печенеж","Днепровский"],["печеніж","Днепровский"],
  ["науки","Голосеевский"],["кириллов","Подольский"],["кирилів","Подольский"],["чорнобиль","Святошинский"],["чернобыл","Святошинский"],["білич","Святошинский"],["билич","Святошинский"],
  ["белая церк","Белая Церковь"],["біла церк","Белая Церковь"],["белая","Белая Церковь"],["біла","Белая Церковь"],
];
const WD = ["вс","пн","вт","ср","чт","пт","сб"];
const WEEK_POS = {пн:0,вт:1,ср:2,чт:3,пт:4,сб:5,вс:6,нд:6};
let state = { orders: [], trucks: [], date: "", depot: "Столичное шоссе, 100, Киев", defaultCap: 1500, kmLimit: 120, perTruck: 12, tab: "day" };
const $ = (id) => document.getElementById(id);
function load() { try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) {} state.orders ||= []; state.trucks ||= []; }
function save() { localStorage.setItem(KEY, JSON.stringify(state)); render(); }
function uid() { return Math.random().toString(36).slice(2, 9); }
const LOCAL = new Set([...KYIV, ...OBLAST, "Украинка", "Киев · район не определён"]);
function outsideKyiv(o) {
  if (!o || !o.address) return false;
  if (LOCAL.has(o.zone)) return false;
  const s = (o.address + " " + (o.zone || "") + " " + (o.shop || "")).toLowerCase();
  if (s.includes("киев") || s.includes("київ") || s.includes("київськ")) return false;
  if (/біла церк|белая церк|вишнев|вишнёв|ірпін|ирпен|буча|бровар|бориспол|бориспіль|обухов|обухів|васильк|вишгород|вышгород|гостомел|боярк|українк|украинк/.test(s)) return false;
  return /област|львів|львов|одес|харків|харьков|дніпр|днепр|вінниц|винниц|житомир|полтав|черніг|черниг|черкас|суми|сумськ|рівне|ровно|терноп|івано|луцьк|ужгород|микола|херсон|кропив|запоріж|запорож/.test(s);
}
function guessZone(text) {
  const s = (text || "").toLowerCase();
  for (const [k,v] of AREA) if (s.includes(k)) return v;
  if (s.includes("киев") || s.includes("київ")) return "Киев · район не определён";
  const city = (text || "").split(",")[0].trim();
  return city || "Без района";
}
const DEPOT = { lat: 50.368, lng: 30.452 };
const COORDS = {
  "Голосеевский":[50.40,30.52],"Дарницкий":[50.41,30.65],"Деснянский":[50.53,30.61],"Днепровский":[50.45,30.60],
  "Оболонский":[50.51,30.50],"Печерский":[50.42,30.55],"Подольский":[50.47,30.51],"Святошинский":[50.46,30.36],
  "Соломенский":[50.43,30.47],"Шевченковский":[50.46,30.50],"Вишнёвое":[50.39,30.37],"Ирпень":[50.52,30.25],
  "Буча":[50.55,30.22],"Бровары":[50.51,30.79],"Борисполь":[50.35,30.95],"Обухов":[50.11,30.63],
  "Васильков":[50.18,30.31],"Вышгород":[50.58,30.49],"Белая Церковь":[49.80,30.11],"Гостомель":[50.57,30.26],
  "Боярка":[50.33,30.29],"Украинка":[50.14,30.75]
};
function pointOf(zone) { const c = COORDS[zone]; return c ? { lat:c[0], lng:c[1] } : null; }
function hav(a,b) {
  const R=6371, d1=(b.lat-a.lat)*Math.PI/180, d2=(b.lng-a.lng)*Math.PI/180;
  const s=Math.sin(d1/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(d2/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function offRoute(p, a, b) {
  const ab = hav(a,b) || 0.001;
  const ap = hav(a,p), bp = hav(b,p);
  if (ap + bp < ab + 0.2) return 0;
  const t = Math.max(0, Math.min(1, (ap*ap + ab*ab - bp*bp) / (2*ab*ab)));
  const lat = a.lat + (b.lat-a.lat)*t, lng = a.lng + (b.lng-a.lng)*t;
  return hav(p, {lat, lng});
}
function isMark(c) { return /^[xхXХ+✓✔*1]$/.test(String(c||"").trim()); }
function splitRow(line) {
  if (line.includes("\t")) return line.split("\t").map(s => s.trim());
  if (line.includes(";")) return line.split(";").map(s => s.trim());
  return line.split(/\s{2,}/).map(s => s.trim());
}
function weekdayOf(d) { return WD[new Date(d + "T12:00:00").getDay()]; }
function headerCol(headers, weekBlock, wd) {
  const heads = headers.map(h => h.toLowerCase());
  const tagged = [];
  heads.forEach((h,i) => {
    const day = (h.match(/пн|вт|ср|чт|пт|сб|нд|вс/) || [""])[0].replace("нд","вс");
    if (!day) return;
    const week = h.includes("п |") || h.includes("п|") ? 1 : h.includes("з |") || h.includes("з|") ? 0 : null;
    tagged.push({i, day, week});
  });
  const same = tagged.filter(x => x.day === wd);
  const byW = same.filter(x => x.week === weekBlock);
  if (byW[0]) return byW[0].i;
  if (same[weekBlock]) return same[weekBlock].i;
  const first = heads.findIndex(h => /пн|вт|ср|чт|пт|сб/.test(h));
  if (first >= 0 && WEEK_POS[wd] != null) return first + WEEK_POS[wd] + weekBlock * 7;
  return null;
}
function parseStore(cells) {
  const parts = cells.filter(Boolean);
  if (!parts.length) return null;
  let code = "", address = "";
  if (/^\d{3,5}$/.test(parts[0])) { code = parts[0]; address = parts[1] || ""; }
  else {
    const m = parts[0].match(/^(\d{3,5})\s+(.+)$/);
    if (m) { code = m[1]; address = m[2]; } else address = parts[0];
  }
  address = address.trim();
  return {
    client: (code ? code + " " : "") + (address.split(",")[0] || "Точка"),
    address, zone: address ? guessZone(address) : "",
    kg: 0, docs: 1, sum: 0, note: code ? "код " + code : ""
  };
}
function parseMoney(s) {
  const n = Number(String(s || "").replace(/\s/g, "").replace(",", "."));
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : 0;
}
function parseShipDate(s) {
  const t = String(s || "");
  let m = t.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + "-" + m[2] + "-" + m[3];
  m = t.match(/(\d{1,2})[./](\d{1,2})[./](\d{4})/);
  if (m) return m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
  return "";
}
function parseOrders(text, onlyDate) {
  const lines = text.split(/\r?\n/).map(s => s.replace(/\u00a0/g, " ").trimEnd()).filter(l => l.trim());
  if (!lines.length) return [];
  let headAt = 0;
  let head = splitRow(lines[0]).map(h => h.toLowerCase());
  const colOf = (arr, names) => arr.findIndex(h => names.some(n => h.includes(n)));
  for (let i = 0; i < Math.min(lines.length, 8); i++) {
    const h = splitRow(lines[i]).map(x => x.toLowerCase());
    if (colOf(h, ["магаз"]) >= 0 && colOf(h, ["отгруз", "відван", "відгруз"]) >= 0) { head = h; headAt = i; break; }
  }
  const col = (names) => colOf(head, names);
  const iOrder = col(["заказ", "замов"]);
  const iOrg = col(["организа", "організа"]);
  const iClient = col(["контраг"]);
  const iSum = col(["сумм"]);
  const iWho = col(["ответ", "відпов"]);
  const iDate = col(["отгруз", "відван", "відгруз"]);
  const iStatus = col(["статус"]);
  const iShop = col(["магаз"]);
  if (iShop < 0 || iDate < 0) return null;
  const rows = [];
  for (let i = headAt + 1; i < lines.length; i++) {
    const c = splitRow(lines[i]);
    if (!c.join("").trim()) continue;
    const date = parseShipDate(c[iDate] || "");
    const shop = c[iShop] || "";
    const address = extractAddress(shop);
    const zone = address ? guessZone(address + " " + shop) : guessZone(shop);
    const away = outsideKyiv({ address, zone, shop });
    if (onlyDate && date && date !== onlyDate && !away) continue;
    const client = (c[iClient] || shop || "Точка").trim();
    rows.push({
      client, address, zone, kg: 0, docs: 1, sum: parseMoney(c[iSum]),
      note: [c[iOrder], c[iStatus], c[iWho]].filter(Boolean).join(" · "),
      orderNo: c[iOrder] || "", shop, date: date || onlyDate
    });
  }
  return rows;
}
function extractAddress(shop) {
  const text = String(shop || "").trim();
  if (!text) return "";
  const paren = text.match(/\(([^)]+)\)/);
  const inner = paren ? paren[1] : text;
  const hasStreet = /вул|бул|пр-т|просп|пров|шосе|наб|площа|,\s*\d|\d/.test(inner) && !/^\s*(рц|рц)\s*$/i.test(inner);
  if (/^\s*(рц)\s*$/i.test(inner) || (!paren && !hasStreet)) return "";
  if (paren && !/вул|бул|пр-т|просп|шосе|\d/.test(inner)) return "";
  return inner.replace(/\s+/g, " ").trim();
}
function parseSchedule(text, dateStr, weekBlock) {
  const lines = text.split(/\r?\n/).map(s => s.replace(/\u00a0/g," ").trimEnd()).filter(l => l.trim());
  const wd = weekdayOf(dateStr);
  let header = -1, col = null;
  for (let i = 0; i < Math.min(lines.length, 6); i++) {
    const idx = headerCol(splitRow(lines[i]), weekBlock, wd);
    if (idx != null) { header = i; col = idx; break; }
  }
  if (col == null && lines[1] && splitRow(lines[1]).length >= 9) { col = 2 + (WEEK_POS[wd]||0) + weekBlock*7; header = 1; }
  const rows = [];
  if (col == null) return { rows, wd, col };
  for (let i = header + 1; i < lines.length; i++) {
    const cells = splitRow(lines[i]);
    if (/магазин|завод/i.test(cells.slice(0,2).join(" "))) continue;
    if (!isMark(cells[col])) continue;
    const rec = parseStore(cells.slice(0, Math.min(col, 3)));
    if (rec) rows.push(rec);
  }
  return { rows, wd, col };
}
function lane() { return state.tab === "trip" ? "trip" : "day"; }
function activeDate() { return state.tab === "trip" ? "trip" : $("date").value; }
function dayOrders(l = lane(), d = activeDate()) {
  return state.orders.filter(o => o.lane === l && (l === "trip" || o.date === d));
}
function trucksOf(l = lane(), d = activeDate()) {
  if (l === "trip") return state.trucks.filter(t => t.lane === "trip" && t.date === $("date").value);
  return state.trucks.filter(t => t.lane === l && (l === "trip" || t.date === d));
}
function kmOf(n) { return Math.round(18 + Math.max(0, n - 1) * 4); }
function sameDay(a, b) {
  return parseShipDate(a) === parseShipDate(b) || String(a || "") === String(b || "");
}
function fmt(d) {
  const m = String(d || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + "." + m[2] + "." + m[1] : (d || "");
}
function money(n) { return (Number(n) || 0).toLocaleString("uk-UA") + " грн"; }

function orderKey(s) {
  const map = { "А":"A","В":"B","Е":"E","К":"K","М":"M","Н":"H","О":"O","Р":"P","С":"C","Т":"T","Х":"X","І":"I","Ї":"I","Є":"E","Ф":"F","Г":"G" };
  const raw = String(s || "").toUpperCase();
  const m = raw.match(/[A-ZА-ЯІЇЄ]{2,3}-\d{6,}/);
  if (!m) return "";
  return m[0].replace(/[А-ЯІЇЄ]/g, ch => map[ch] || ch);
}
$("loadPack").onclick = () => {
  const day = $("date").value;
  const raw = $("pack").value;
  const orders = parseOrders(raw, day);
  let rows = orders;
  if (!rows || !rows.length) {
    const any = parseOrders(raw, "");
    if (any && any.length) {
      const next = any.map(r => r.date).find(Boolean) || day;
      $("date").value = next;
      state.date = next;
      rows = any.filter(r => !r.date || r.date === next || outsideKyiv(r));
    }
  }
  if (orders === null && (!rows || !rows.length)) {
    const parsed = parseSchedule(raw, day, 0);
    rows = parsed.rows.map(r => ({ ...r, date: day }));
  }
  if (!rows || !rows.length) { $("loadStatus").textContent = "На эту дату не найдено заявок. Вставьте таблицу вместе с шапкой."; return; }
  const destLane = "day";
  let added = 0, skipped = 0;
  const useDate = $("date").value || day;
  rows.forEach(p => {
    const key = orderKey(p.orderNo || p.note);
    const lane = outsideKyiv(p) ? "trip" : destLane;
    const existing = key ? state.orders.find(o => orderKey(o.orderNo || o.note) === key) : null;
    if (existing && !existing.truckId) {
      existing.date = p.date || useDate;
      existing.lane = lane;
      existing.address = p.address;
      existing.zone = p.zone;
      existing.client = p.client;
      existing.shop = p.shop;
      existing.sum = p.sum;
      existing.basket = !p.address;
      skipped++;
      return;
    }
    if (existing) { skipped++; return; }
    state.orders.push({ id: uid(), lane, truckId: null, date: p.date || useDate, ...p, orderNo: key || p.orderNo || "", basket: !p.address });
    added++;
  });
  state.orders.forEach(o => { if (o.address && !outsideKyiv(o)) o.basket = false; });
  state.date = useDate;
  $("pack").value = "";
  save();
  const dayN = state.orders.filter(o => !o.truckId && !outsideKyiv(o) && o.address && (o.date === useDate || !o.date)).length;
  $("loadStatus").textContent = fmt(useDate) + ": в очереди дня " + dayN + ". Добавлено " + added + ", обновлено " + skipped + ".";
};
$("autoBtn").onclick = () => {
  const l = lane();
  if (l === "trip") { alert("Командировка только вручную."); return; }
  const d = activeDate();
  const list = dayOrders(l, d).filter(o => o.address);
  if (!list.length) { alert("Нет заявок с адресом на эту дату."); return; }
  list.forEach(o => o.truckId = null);
  const cap = Number($("defaultCap").value||1500);
  const per = Number($("perTruck").value||12);
  const kmLimit = Number($("kmLimit").value||120);
  const docsOf = o => Number(o.docs) || 1;
  const open = list.slice();
  state.trucks = state.trucks.filter(t => !(t.lane === l && (l === "trip" || t.date === d)));
  const zones = [...new Set(open.map(o => o.zone || "Без района"))].sort((a,b) => a.localeCompare(b, "ru"));
  zones.forEach(zone => {
    let left = open.filter(o => !o.truckId && (o.zone || "Без района") === zone);
    let n = 1;
    while (left.length) {
      const truck = { id: uid(), name: left.length > per || n > 1 ? zone + " " + n : zone, lane: l, date: d, zone, cap, kmLimit, driver: "" };
      state.trucks.push(truck);
      const taken = [];
      left.forEach(o => {
        if (taken.reduce((s,x)=>s+docsOf(x),0) + docsOf(o) > per) return;
        taken.push(o);
      });
      if (!taken.length) taken.push(left[0]);
      taken.forEach((o,i) => { o.truckId = truck.id; o.seq = i + 1; });
      n++;
      left = open.filter(o => !o.truckId && (o.zone || "Без района") === zone);
    }
  });
  save();
};
$("addTruckBtn").onclick = () => {

$("clearDay").onclick = () => {

$("gotoTrip") && ($("gotoTrip").onclick = () => document.querySelector('[data-tab="trip"]').click());

function monthCells() {
  const start = new Date(); start.setHours(12,0,0,0);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const x = new Date(start); x.setDate(start.getDate() + i);
    const iso = localISO(x);
    const dayN = state.orders.filter(o => o.lane === "day" && o.date === iso).length;
    const weekN = state.orders.filter(o => o.lane === "week" && o.date === iso).length;
    const dayTrucks = state.trucks.filter(t => t.lane === "day" && t.date === iso);
    const weekTrucks = state.trucks.filter(t => t.lane === "week" && t.date === iso);
    const trips = state.trucks.filter(t => t.lane === "trip" && t.date === iso);
    const wd = x.getDay();
    cells.push({ iso, label: iso.slice(8)+"."+iso.slice(5,7), dayN, weekN, dayTrucks, weekTrucks, trips, weekNo: Math.floor(i / 7) + 1, tone: wd === 1 ? "mon" : (wd === 0 || wd === 6 ? "weekend" : ""), wd });
  }
  return cells;
}
function localISO(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function openTrip(id) {
  const t = state.trucks.find(x => x.id === id);
  if (!t) return;
  state.tab = "trip";
  state.focusTruck = t.id;
  state.showDate = false;
  if (/^\d{4}-\d{2}-\d{2}$/.test(t.date)) { state.date = t.date; $("date").value = t.date; }

  if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
}
function render() {

  $("basket").innerHTML = basket.length ? basket.map(o => `<div style="padding:6px 0;border-bottom:1px solid #e6dcc8"><b>${o.orderNo || o.note || "без номера"}</b> · ${o.client}<div class="muted">${o.shop || ""} ${o.sum ? money(o.sum) : ""}</div><select data-to="${o.id}"><option value="">в машину…</option>${trucksOf().map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select> <button data-del="${o.id}">×</button></div>`).join("") : empty;
  if (!basket.length) $("basket").innerHTML = empty;
  if (!away.length) $("away").innerHTML = empty;
  $("queue").innerHTML = queued.length ? queued.map(o => `<div style="padding:6px 0;border-bottom:1px solid #e6dcc8"><b>${o.orderNo || o.zone || "без номера"}</b> · ${o.client}<div class="muted">${o.zone || ""} · ${o.address}</div><select data-to="${o.id}"><option value="">в машину…</option>${both}</select> <button data-del="${o.id}">×</button></div>`).join("") : empty;
  bind();

  $("board").innerHTML = trucks.map(t => {
    const stops = state.orders.filter(o => o.truckId === t.id).sort((a,b) => (a.seq||0) - (b.seq||0));
    const km = kmOf(stops.length);
    const sum = stops.reduce((s,o)=>s+(Number(o.sum)||0),0);
    const docs = stops.reduce((s,o)=>s+(Number(o.docs)||0),0);
    const over = km > (t.kmLimit||120);
    return `<div class="truck">
      <div class="truck head"><b>${t.name || "Машина"}</b><span class="tag ${over?"bad":""}">${t.lane==="trip"?"командировка":"день"} · ${stops.length} точ. · ${km}/${t.kmLimit||120} км · ${docs} накл. · ${money(sum)}</span></div>
      <div class="row zone-row">
        <input data-rename="${t.id}" value="${String(t.name||"").replaceAll('"','')}" placeholder="Название машины" />
        <input data-zone="${t.id}" value="${t.zone||""}" placeholder="Район или пункт" list="zones" />
      </div>
      <div class="row">
        <div><label>Лимит кг</label><input data-cap="${t.id}" type="number" value="${t.cap||1500}" /></div>
        <div><label>Лимит км</label><input data-kml="${t.id}" type="number" value="${t.kmLimit||120}" /></div>
      </div>
      ${l==="trip"?`<label>Дата командировки</label><input data-tdate="${t.id}" type="date" value="${/^\d{4}-\d{2}-\d{2}$/.test(t.date)?t.date:""}" />`:""}
      <div class="muted">0 · склад · ${$("depot").value}</div>
      ${stops.map((o,i)=>`<div class="stop"><b>${i+1}</b><div><b>${o.client}</b><div class="muted">${o.address || "без адреса"}</div><div class="noprint"><button data-up="${o.id}">↑</button> <button data-down="${o.id}">↓</button> <button data-basket="${o.id}">снять</button></div></div>
        <input data-docs="${o.id}" type="number" min="0" value="${o.docs||0}" title="накладных" />

  $("board").insertAdjacentHTML("beforeend", `<datalist id="zones">${[...KYIV,...OBLAST].map(z=>`<option value="${z}">`).join("")}</datalist>`);

}
function bind() {
  document.querySelectorAll("[data-to]").forEach(el => el.onchange = () => {
    const o = state.orders.find(x => x.id === el.dataset.to);
    const t = state.trucks.find(x => x.id === el.value);
    if (!o || !t) return;
    if (o.address && t.zone && o.zone && t.zone !== o.zone) {
      if (!confirm("Адрес в зоне «" + o.zone + "», машина привязана к «" + t.zone + "». Всё равно добавить?")) { el.value = ""; return; }
    }
    if (!t.zone && o.zone) t.zone = o.zone;
    o.truckId = t.id;
    o.basket = false;
    if (t.date && t.date !== "trip") o.date = t.date;
    o.lane = t.lane || o.lane;
    save();
  });
  document.querySelectorAll("[data-del]").forEach(el => el.onclick = () => { state.orders = state.orders.filter(x => x.id !== el.dataset.del); save(); });
  document.querySelectorAll("[data-rename]").forEach(el => el.onchange = () => {
    const t = state.trucks.find(x => x.id === el.dataset.rename);
    if (t) t.name = el.value.trim();
    save();
  });
  document.querySelectorAll("[data-zone]").forEach(el => el.onchange = () => { state.trucks.find(t=>t.id===el.dataset.zone).zone = el.value; save(); });
  document.querySelectorAll("[data-cap]").forEach(el => el.onchange = () => { state.trucks.find(t=>t.id===el.dataset.cap).cap = Number(el.value||0); save(); });
  document.querySelectorAll("[data-kml]").forEach(el => el.onchange = () => { state.trucks.find(t=>t.id===el.dataset.kml).kmLimit = Number(el.value||120); save(); });
  document.querySelectorAll("[data-tdate]").forEach(el => el.onchange = () => { state.trucks.find(t=>t.id===el.dataset.tdate).date = el.value; save(); });
  document.querySelectorAll("[data-docs]").forEach(el => el.onchange = () => { state.orders.find(o=>o.id===el.dataset.docs).docs = Number(el.value||0); save(); });
  document.querySelectorAll("[data-sum]").forEach(el => el.onchange = () => { state.orders.find(o=>o.id===el.dataset.sum).sum = Number(el.value||0); save(); });
  document.querySelectorAll("[data-upfree]").forEach(el => el.onclick = () => { state.orders.forEach(o => { if (o.truckId === el.dataset.upfree) { o.truckId = null; o.basket = !o.address; } }); save(); });
  document.querySelectorAll("[data-drop]").forEach(el => el.onclick = () => {
    const t = state.trucks.find(x => x.id === el.dataset.drop);
    if (t && t.lane === "trip" && !confirm("Очистить эту командировочную машину?")) return;
    state.orders.forEach(o => { if (o.truckId === el.dataset.drop) { o.truckId = null; o.basket = !o.address; } });
    state.trucks = state.trucks.filter(x => x.id !== el.dataset.drop);
    save();
  });

  document.querySelectorAll("[data-route]").forEach(el => el.onclick = () => route(el.dataset.route));
  document.querySelectorAll("[data-up]").forEach(el => el.onclick = () => moveStop(el.dataset.up, -1));
  document.querySelectorAll("[data-down]").forEach(el => el.onclick = () => moveStop(el.dataset.down, 1));
  document.querySelectorAll("[data-basket]").forEach(el => el.onclick = () => {
    const o = state.orders.find(x => x.id === el.dataset.basket);
    if (!o) return;
    o.truckId = null;
    o.basket = !o.address;
    save();
  });

    $("date").value = el.dataset.day;

    state.tab = "day";
    document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x.dataset.tab === "day"));
    save();
  });
}
function moveStop(id, dir) {
  const o = state.orders.find(x => x.id === id);
  if (!o) return;
  const list = state.orders.filter(x => x.truckId === o.truckId).sort((a,b) => (a.seq||0) - (b.seq||0));
  list.forEach((x,i) => x.seq = i+1);
  const i = list.findIndex(x => x.id === id), j = i + dir;
  if (j < 0 || j >= list.length) return;
  const s = list[i].seq; list[i].seq = list[j].seq; list[j].seq = s;
  save();
}
function route(id) {
  const stops = state.orders.filter(o => o.truckId === id && o.address && !/міхнов|optimizer/i.test(o.address)).sort((a,b) => (a.seq||0) - (b.seq||0));
  if (!stops.length) { alert("В машине нет адресов."); return; }
  const parts = [$("depot").value, ...stops.map(o => o.address + ", Украина")].map(s => encodeURIComponent(s));
  window.open("https://www.google.com/maps/dir/" + parts.join("/"), "_blank");
}
function closeTrip(id) {
  const t = state.trucks.find(x => x.id === id);
  if (!t) return;
  const km = prompt("Фактический километраж", t.factKm || "");
  if (km === null) return;
  const sum = prompt("Фактическая сумма, грн", t.factSum || "");
  if (sum === null) return;
  const note = prompt("Факт: что изменилось", t.factNote || "");
  if (note === null) return;
  t.factKm = km;
  t.factSum = sum;
  t.factNote = note;
  t.closed = true;
  save();
  pdf(id, true);
}
function dayReport(date) {
  const trucks = state.trucks.filter(t => t.lane === "day" && t.date === date);
  if (!trucks.length) return;
  const blocks = trucks.map(t => {
    const stops = state.orders.filter(o => o.truckId === t.id);
    const sum = stops.reduce((s,o)=>s+(Number(o.sum)||0),0);
    return `<h3>${t.name} · ${t.zone||""}</h3><p>Точек ${stops.length}, накладных ${stops.reduce((s,o)=>s+(Number(o.docs)||0),0)}, сумма ${money(sum)}</p><ol>${stops.map(o=>`<li>${o.client} — ${o.address} — ${money(o.sum)}</li>`).join("")}</ol>`;
  }).join("");
  $("printArea").classList.remove("hide");
  $("printArea").innerHTML = `<h2>Накладная за ${fmt(date)}</h2><p>Машин: ${trucks.length}. Склад: ${$("depot").value}</p>${blocks}`;
  window.print();
}
function pdf(id, closed) {
  const t = state.trucks.find(x => x.id === id);
  const stops = state.orders.filter(o => o.truckId === id).sort((a,b) => (a.seq||0) - (b.seq||0));
  const sum = stops.reduce((s,o)=>s+(Number(o.sum)||0),0);
  const line = (o) => String(o.orderNo || "").replace(/(\d{2}\.\d{2}\.\d{4}).*$/, "$1");
  $("printArea").classList.remove("hide");
  $("printArea").innerHTML = `<h2>Накладная</h2>
    <p>Дата: ${fmt(t.date)}<br>Машина: ${t.name}<br>Зона: ${t.zone||"—"}<br>Старт: ${$("depot").value}<br>Точек: ${stops.length}</p>
    <ol>${stops.map(o=>`<li><b>${o.client}</b> — ${o.address}<br>накладных: ${o.docs||0}, сумма: ${money(o.sum)} ${line(o)}</li>`).join("")}</ol>`;
  window.print();
}
load();
$("date").value = state.date || new Date(Date.now()+86400000).toISOString().slice(0,10);
$("depot").value = state.depot;
$("defaultCap").value = state.defaultCap;
$("kmLimit").value = state.kmLimit || 120;

["depot","defaultCap","kmLimit","perTruck"].forEach(id => $(id).onchange = () => { state[id] = id==="depot" ? $(id).value : Number($(id).value); save(); });
$("date").onchange = () => { state.date = $("date").value; save(); };
